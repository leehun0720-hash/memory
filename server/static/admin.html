<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>추모 운영 · 관리자 콘솔</title>
<link rel="stylesheet" href="/static/css/app.css">
<style>
  /* 관리자 콘솔은 밝은 사무용 화면을 유지한다(유족 앱의 어두운 테마 토큰을 되돌림). */
  :root { --bg: #f6f2ea; --bg-2: #f6f2ea; --bg-3: #ece6d8; --surface: #ffffff; --surface-2: #f1ede4; --surface-solid: #ffffff; --line: #e4ddd0; --line-strong: #cdbf9e;
    --ink: #2b2a27; --muted: #6f6a60; --accent: #2f5d50; --accent-ink: #ffffff; --btn-a: #3a7263; --btn-b: #2f5d50; --gold-2: #2b2a27; --glow: 47, 93, 80;
    --danger: #a33a2c; --ok: #1e7a45; --warn-bg: #fff6e0; --ai-bg: #efe7f7; --ai-ink: #4a2d6b; --font-serif: "Noto Sans KR", "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
  body::before, body::after { display: none; }
  body { padding-bottom: 0; font-size: 15px; }
  h1, h2, h3 { font-family: var(--font-sans); } h3 { color: var(--muted); }
  input, textarea, select { background: #fff; } input::placeholder, textarea::placeholder { color: #9a948a; }
  button, .btn { box-shadow: none; border-radius: 10px; } button.secondary, .btn.secondary { background: #fff; border-color: var(--accent); }
  .card { box-shadow: none; backdrop-filter: none; } .modal { box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .toast { background: #2b2a27; color: #fff; border: none; }
  .notice { color: var(--ink); } .notice.danger { color: var(--danger); }
  .portrait { box-shadow: none; }
  .pill { background: #eee; color: #555; border: none; }
  .bubble.them { background: #fff; } .bubble.me { background: var(--accent); color: #fff; }
  .layout { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  aside { background: #2b2a27; color: #ddd; padding: 18px 14px; }
  aside .brand { font-weight: 800; color: #fff; margin-bottom: 14px; font-size: 16px; }
  aside button { background: transparent; color: #cfc8ba; text-align: left; justify-content: flex-start; min-height: 44px; font-size: 15px; border-radius: 10px; margin-bottom: 2px; }
  aside button.active { background: #3f3d38; color: #fff; }
  section.page { padding: 20px 26px; max-width: 1200px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  .kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .kpi .card { margin: 0; }
  .kpi .n { font-size: 30px; font-weight: 800; color: var(--accent); }
  .cal { display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
  #canvasWrap { position: relative; background: #111; border-radius: 12px; overflow: hidden; }
  #cal { width: 100%; display: block; cursor: crosshair; }
  .niche-row { display: flex; gap: 6px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .niche-row input { padding: 4px 8px; font-size: 13px; width: 110px; }
  button.small { width: auto; }
  input, select, textarea { font-size: 15px; padding: 8px 10px; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .form-grid .field { margin: 0; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 8px; font-size: 12px; background: #eee; color: #555; }
  .tag.on { background: #dff3e6; color: #1e7a45; } .tag.off { background: #fbe9e6; color: var(--danger); } .tag.busy { background: #fff1d6; color: #9a6a10; }
</style>
