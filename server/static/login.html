<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121410">
<title>로그인 · 여수 지장대사 여해원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
<main class="login-wrap">
  <a class="login-brand" href="/demo" aria-label="여해원 가족 추모 공간 처음 화면"><b>여해원</b><small>麗海苑 · 여수 지장대사</small></a>
  <section class="login-card" aria-labelledby="loginTitle">
    <p class="login-kicker"><span></span>가족 추모 공간 · 운영 콘솔</p>
    <h1 id="loginTitle">로그인</h1>
    <div class="login-tabs" role="tablist" aria-label="로그인 종류">
      <button type="button" role="tab" id="tabFamily" aria-selected="true" aria-controls="loginForm" data-kind="family">가족</button>
      <button type="button" role="tab" id="tabStaff" aria-selected="false" aria-controls="loginForm" data-kind="staff">직원</button>
    </div>
    <form id="loginForm" class="login-form" role="tabpanel" aria-labelledby="tabFamily" novalidate>
      <label for="loginId">아이디</label>
      <input id="loginId" name="login_id" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="60">
      <label for="loginPw">비밀번호</label>
      <input id="loginPw" name="password" type="password" autocomplete="current-password" required maxlength="200">
      <p class="login-msg" id="loginMsg" role="alert"></p>
      <button type="submit" id="loginBtn">로그인</button>
    </form>
    <p class="login-help" id="helpFamily">처음이신가요? 받으신 <b>초대 링크</b>로 가족 화면을 연 뒤 <b>설정 → 로그인 정하기</b>에서 아이디와 비밀번호를 만들어 주세요. 초대 링크로 들어오기는 그대로 쓸 수 있습니다.</p>
    <p class="login-help" id="helpStaff" hidden>직원 계정은 시설 운영자가 관리자 콘솔의 <b>직원 계정</b>에서 만들어 드립니다. 로그인은 12시간 동안 유지됩니다.</p>
    <aside class="login-demo" id="demoHint" hidden><b>시연 계정</b><span>가상 가족 <em id="demoMember"></em> 님 · 아이디 <code id="demoId"></code> · 비밀번호 <code id="demoPw"></code></span><button type="button" class="link" id="demoFill">시연 계정 넣기</button></aside>
  </section>
  <p class="login-foot"><a href="/demo">시연 시작 화면</a> · 인물·계약은 모두 시연용 가상 정보입니다.</p>
</main>
<script src="/static/js/login.js"></script>
</body>
</html>
